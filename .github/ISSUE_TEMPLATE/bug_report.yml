name: Bug report
description: Report a bug in SnipMD.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: SnipMD version
      description: Shown in Settings → Apps on Windows, or the release you downloaded.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11 (installer)
        - Windows 10 (installer)
        - macOS (test build)
        - Built from source (npm run tauri dev)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new tab (`Ctrl+T`)
        2. Paste a screenshot (`Win+Shift+S`, then `Ctrl+V`)
        3. Press `Ctrl+S` to save...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages (if any)
      description: The text of any error bar, or console output when built from source.
      render: shell
