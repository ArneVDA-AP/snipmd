name: Bug Report
description: Report a bug in SnipMD's editor, clipboard snipping, .assets/ GC, or Windows 11 desktop shell
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in **SnipMD**!
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime Environment
      options:
        - Windows 11 Native Desktop (.exe / .msi)
        - Tauri v2 Dev Mode (npm run tauri:dev)
        - Browser Web Preview (npm run dev)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open an unsaved scratch tab (`Ctrl+T`)
        2. Paste a snip (`Win+Shift+S` -> `Ctrl+V`)
        3. Press `Ctrl+S` to save...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console or Build Logs (if applicable)
      render: shell
