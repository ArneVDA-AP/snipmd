name: Feature request
description: Propose an improvement to SnipMD.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What in your note-taking or screenshot workflow does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it should work. SnipMD keeps to the budgets in docs/SPEC.md §9 (its own start under 150 ms, cold start under 1 s, installer under 10 MB); ideas outside the scope in docs/SPEC.md §12 stay open as proposals until the maintainer agrees.
    validations:
      required: true
