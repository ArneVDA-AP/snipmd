name: macOS run

# Manual: builds the universal app on a macOS runner (ad-hoc signed, SPEC §13), runs
# tools/measure/macos-probe.sh against it (the acceptance probes of #30), prints the probe lines in
# the log and uploads them with the screenshots as a workflow artifact (kept 30 days). Nothing is
# committed or pushed. A runner is not a Mac on a desk: the manual checklist in RELEASE-MACOS.md is the judge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false # install scripts and build.rs never see a write token

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Build
        run: |
          npm ci
          npx tauri build --target universal-apple-darwin --bundles app --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          du -sh src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

      - name: Probe
        shell: bash # pipefail: a broken harness fails the job through tee
        run: |
          out="$RUNNER_TEMP/macos-run"
          mkdir -p "$out"
          app=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          tools/measure/macos-probe.sh "$app" "$out" 2>&1 | tee "$out/probe.txt"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-run-${{ github.run_number }}
          path: ${{ runner.temp }}/macos-run
          if-no-files-found: warn
          retention-days: 30
