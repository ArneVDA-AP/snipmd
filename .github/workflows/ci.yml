name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests (frontend)
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Unit tests (snipmd-core)
        working-directory: src-tauri
        run: cargo test -p snipmd-core --locked

      - name: Check Tauri crate
        working-directory: src-tauri
        run: cargo check --locked

  check-macos:
    # SPEC §13: the Rust side must keep compiling for both Mac architectures. Typecheck and
    # frontend tests do not depend on the OS and run in the Windows job only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Unit tests (snipmd-core)
        working-directory: src-tauri
        run: cargo test -p snipmd-core --locked

      - name: Check Tauri crate (Apple Silicon and Intel)
        working-directory: src-tauri
        run: |
          cargo check --locked --target aarch64-apple-darwin
          cargo check --locked --target x86_64-apple-darwin
