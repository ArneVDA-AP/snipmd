name: Windows run

# Manual: builds the release app on a Windows runner, measures the SPEC §9 budgets with
# tools/measure/measure.ps1, screenshots the real window with tools/measure/shots.ps1, and uploads
# the results as a workflow artifact (kept 30 days). A second job, which runs no repository code,
# pushes the same files to the branch test/windows-run-<run number>, so they can be read with git.
# A runner is not an ordinary laptop: the numbers are a reference; release budgets are measured on
# real hardware.
on:
  workflow_dispatch:
    inputs:
      snip_sleep:
        description: 'Also screenshot Snip asleep (adds about 10 minutes)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # install scripts and build.rs never see a write token

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Build
        run: |
          npm ci
          npx tauri build --bundles nsis

      - name: Windows version
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path results/windows-ci | Out-Null
          $v = [Environment]::OSVersion.Version
          "Runner: $((Get-CimInstance Win32_OperatingSystem).Caption) build $($v.Build), $((Get-CimInstance Win32_Processor | Select-Object -First 1).Name), $([Math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)) GB" | Tee-Object results/windows-ci/runner.txt

      - name: Measure budgets
        continue-on-error: true
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File tools/measure/measure.ps1 -Exe src-tauri/target/release/snip-md.exe -Runs 5 -Pastes 3 2>&1 | Tee-Object results/windows-ci/measure.txt

      - name: Screenshots
        continue-on-error: true
        shell: powershell
        run: |
          $sleep = @(); if ('${{ inputs.snip_sleep }}' -eq 'true') { $sleep = @('-SnipSleep') }
          powershell -ExecutionPolicy Bypass -File tools/measure/shots.ps1 -Exe src-tauri/target/release/snip-md.exe -Out results/ui @sleep 2>&1 | Tee-Object results/windows-ci/shots.txt

      - name: Clean-install smoke test
        continue-on-error: true
        shell: powershell
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          powershell -ExecutionPolicy Bypass -File tools/measure/install-smoke.ps1 -Setup $setup.FullName 2>&1 | Tee-Object results/windows-ci/install-smoke.txt

      - name: Convert result files to UTF-8
        if: always()
        shell: bash
        run: |
          for f in results/windows-ci/*.txt; do iconv -f UTF-16 -t UTF-8 "$f" > "$f.u" 2>/dev/null && mv "$f.u" "$f" || rm -f "$f.u"; done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-run-${{ github.run_number }}
          path: |
            results/windows-ci
            results/ui
          if-no-files-found: warn
          retention-days: 30

  # The build job above never holds a write token; this one only gets the files and pushes them.
  branch:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-run-${{ github.run_number }}
          path: results

      - name: Push to test/windows-run-${{ github.run_number }}
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          cd results
          git init -q
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Windows run $RUN on $SHA: budgets and screenshots"
          git push -q "https://x-access-token:$TOKEN@github.com/$REPO" "HEAD:refs/heads/test/windows-run-$RUN"
