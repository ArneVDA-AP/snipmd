name: Release Windows 11 (x64 NSIS, MSI & Portable)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-11:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri v2 Windows 11 Release (NSIS .exe + WiX .msi + Portable .exe)
        run: npx tauri build --bundles nsis,msi

      - name: Stage Windows 11 Release Executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-win11 | Out-Null
          Copy-Item "src-tauri/target/release/snip-md.exe" "release-win11/SnipMD_0.1.0_x64_Portable.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" "release-win11/"
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" "release-win11/"
          Get-ChildItem release-win11

      - name: Upload Windows 11 Installers to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnipMD-v0.1.0-Win11-x64-Installers
          path: |
            release-win11/*.exe
            release-win11/*.msi

      - name: Publish GitHub Release (v0.1.0)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.1.0
          name: 'SnipMD v0.1.0 — Windows 11 Release (x64)'
          body: |
            ## SnipMD v0.1.0 for Windows 11 (x64)
            - **NSIS Per-User Setup (`SnipMD_0.1.0_x64-setup.exe`)**: Registers `.md` and `.markdown` file associations and installs Start Menu shortcuts.
            - **WiX Enterprise Installer (`SnipMD_0.1.0_x64_en-US.msi`)**: Standard Windows 11 MSI package.
            - **Portable Executable (`SnipMD_0.1.0_x64_Portable.exe`)**: Standalone single-file native Windows 11 WebView2 executable.
          draft: false
          prerelease: false
          files: |
            release-win11/*.exe
            release-win11/*.msi
