name: Release Windows

# Releases come from version tags only. A manual run builds the files as workflow artifacts and
# publishes nothing. The build job has a read-only token; only the publish job can write, and it
# runs no project code.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # install scripts and build.rs never see a write token

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $crate = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          foreach ($x in @($v, $conf, $crate)) {
            if ("v$x" -ne $env:TAG) { throw "Tag $env:TAG does not match the versions: package.json $v, tauri.conf.json $conf, Cargo.toml $crate" }
          }

      - name: Build installers
        run: npx tauri build --bundles nsis,msi

      - name: Stage files and check the installer size (SPEC §9, under 10 MB)
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "src-tauri/target/release/snip-md.exe" "release/SnipMD_${v}_x64_portable.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" "release/"
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" "release/"
          Get-ChildItem release | ForEach-Object { '{0,-44} {1,8:N2} MB' -f $_.Name, ($_.Length / 1MB) }
          $setup = Get-ChildItem "release/*-setup.exe" | Select-Object -First 1
          "INSTALLER_MB=$([Math]::Round($setup.Length / 1MB, 2))" | Out-File -Append $env:GITHUB_ENV
          if ($setup.Length -ge 10MB) { throw "Installer is $($setup.Length / 1MB) MB, over the 10 MB budget" }

      - name: Size in the summary
        shell: pwsh
        run: '"Installer: $env:INSTALLER_MB MB" | Out-File -Append $env:GITHUB_STEP_SUMMARY'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SnipMD-windows-x64
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SnipMD-windows-x64
          path: release

      # Only the changelog is checked out: this job has write access and runs no project code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The release page shows what is new: this version's CHANGELOG section, then the downloads.
      - name: Write the release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          cat >> notes.md <<'TEXT'

          ## Download
          **Windows 10 and 11** (x64):
          - `…_x64-setup.exe`: the installer most people want. No admin rights; registers `.md` and `.markdown`, and fetches WebView2 if Windows lacks it.
          - `…_x64_en-US.msi`: for managed installs.
          - `…_x64_portable.exe`: the app without installing (needs WebView2).

          The files are not code-signed yet, so SmartScreen may warn on the first run: *More info*, then *Run anyway*.
          TEXT

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: SnipMD ${{ github.ref_name }}
          # A version with a suffix (v1.1.0-1) is a test build: a pre-release, never "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          files: release/*
