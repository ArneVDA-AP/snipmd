name: Release Windows

# Releases come from version tags only. A manual run builds the files as workflow artifacts and
# publishes nothing.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run lint
          npm test

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $v" }

      - name: Build installers
        run: npx tauri build --bundles nsis,msi

      - name: Stage files and check the installer size (SPEC §9, under 10 MB)
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "src-tauri/target/release/snip-md.exe" "release/SnipMD_${v}_x64_portable.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" "release/"
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" "release/"
          Get-ChildItem release | ForEach-Object { '{0,-44} {1,8:N2} MB' -f $_.Name, ($_.Length / 1MB) }
          $setup = Get-ChildItem "release/*-setup.exe" | Select-Object -First 1
          "INSTALLER_MB=$([Math]::Round($setup.Length / 1MB, 2))" | Out-File -Append $env:GITHUB_ENV
          if ($setup.Length -ge 10MB) { throw "Installer is $($setup.Length / 1MB) MB, over the 10 MB budget" }

      - name: Size in the summary
        shell: pwsh
        run: '"Installer: $env:INSTALLER_MB MB" | Out-File -Append $env:GITHUB_STEP_SUMMARY'

      - uses: actions/upload-artifact@v4
        with:
          name: SnipMD-windows-x64
          path: release/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SnipMD ${{ github.ref_name }}
          body: |
            SnipMD for Windows 10 and 11 (x64). See CHANGELOG.md for what changed.
            - `SnipMD_*_x64-setup.exe`: per-user installer; registers .md and .markdown and fetches WebView2 if missing.
            - `SnipMD_*_x64_en-US.msi`: for managed installs.
            - `SnipMD_*_x64_portable.exe`: the app without installer (needs WebView2).
          files: release/*
