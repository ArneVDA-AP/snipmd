name: Release Windows

# Releases come from version tags only. A manual run builds the files as workflow artifacts and
# publishes nothing. The build job has a read-only token; only the publish job can write, and it
# runs no project code.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false # install scripts and build.rs never see a write token

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $crate = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          foreach ($x in @($v, $conf, $crate)) {
            if ("v$x" -ne $env:TAG) { throw "Tag $env:TAG does not match the versions: package.json $v, tauri.conf.json $conf, Cargo.toml $crate" }
          }

      - name: Build installers
        run: npx tauri build --bundles nsis,msi

      - name: Stage files and check the installer size (SPEC §9, under 10 MB)
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "src-tauri/target/release/snip-md.exe" "release/SnipMD_${v}_x64_portable.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" "release/"
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" "release/"
          Get-ChildItem release | ForEach-Object { '{0,-44} {1,8:N2} MB' -f $_.Name, ($_.Length / 1MB) }
          $setup = Get-ChildItem "release/*-setup.exe" | Select-Object -First 1
          "INSTALLER_MB=$([Math]::Round($setup.Length / 1MB, 2))" | Out-File -Append $env:GITHUB_ENV
          if ($setup.Length -ge 10MB) { throw "Installer is $($setup.Length / 1MB) MB, over the 10 MB budget" }

      - name: Size in the summary
        shell: pwsh
        run: '"Installer: $env:INSTALLER_MB MB" | Out-File -Append $env:GITHUB_STEP_SUMMARY'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SnipMD-windows-x64
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SnipMD-windows-x64
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: SnipMD ${{ github.ref_name }}
          body: |
            SnipMD for Windows 10 and 11 (x64). See CHANGELOG.md for what changed.
            - `SnipMD_*_x64-setup.exe`: per-user installer; registers .md and .markdown and fetches WebView2 if missing.
            - `SnipMD_*_x64_en-US.msi`: for managed installs.
            - `SnipMD_*_x64_portable.exe`: the app without installer (needs WebView2).
          files: release/*
