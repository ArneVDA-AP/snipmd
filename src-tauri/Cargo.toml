[package]
name = "snip-md"
version = "0.1.0"
description = "Frameless Windows 11 Markdown & Snipping Tool Note-Taking Workspace"
authors = ["SnipMD Contributors"]
edition = "2021"

[lib]
name = "snip_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rand = "0.8"
snipmd-core = { path = "core" }
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# applicationShouldTerminate: and the clipboard for Paste as Plain Text (src/macos.rs). All three are
# already in the tree through tao, with these features on, so they add nothing to the build.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[workspace]
members = ["core"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
